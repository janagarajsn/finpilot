# FX & MCP suite (AMENDMENT_1 suite 9). A fixed reference rate table (INR per 1 USD, business
# days only) in January 2001: dates no real rate in the database touches, so the suite can run
# against the dev database and clean up after itself. Expected values computed independently
# (Decimal, round half even to 2 places).
rates:
  "2000-12-29": "46.6000"   # Friday before the New Year holiday
  "2001-01-02": "46.6500"
  "2001-01-03": "46.7000"
  "2001-01-04": "46.7200"
  "2001-01-05": "46.7500"
  "2001-01-08": "46.8000"
  "2001-01-09": "46.7800"
today: "2001-01-10"

conversions:
  - {amount: "100", from: USD, to: INR, date: "2001-01-02", expected: "4665.00"}
  - {amount: "12.34", from: USD, to: INR, date: "2001-01-05", expected: "576.90"}   # 576.895 → half even
  - {amount: "99.99", from: USD, to: INR, date: "2001-01-09", expected: "4677.53"}
  - {amount: "4665", from: INR, to: USD, date: "2001-01-02", expected: "100.00"}
  - {amount: "1000", from: INR, to: USD, date: "2001-01-04", expected: "21.40"}
  - {amount: "2500", from: INR, to: USD, date: "2001-01-08", expected: "53.42"}
  - {amount: "55.55", from: USD, to: USD, date: "2001-01-03", expected: "55.55"}
  - {amount: "777", from: INR, to: INR, date: "2001-01-03", expected: "777.00"}

dates:   # non-business dates resolve to the previous business day's rate
  - {date: "2001-01-06", expect_rate_date: "2001-01-05", kind: saturday}
  - {date: "2001-01-07", expect_rate_date: "2001-01-05", kind: sunday}
  - {date: "2001-01-01", expect_rate_date: "2000-12-29", kind: holiday}
  - {date: "2001-01-09", expect_rate_date: "2001-01-09", kind: business_day}
  - {date: "2001-02-15", expect_rate_date: "2001-01-09", kind: future_uses_latest}

round_trip_amounts: ["0.01", "1", "12.34", "99.99", "250", "1234.56", "9999.99"]

grounding:   # text about converting $20 on 2001-01-05 (→ ₹935.00 at 46.75)
  - {text: "That is about ₹935 at today's rate.", grounded: true}
  - {text: "$20 is ₹935.00 (46.75 rupees per dollar).", grounded: true}
  - {text: "That is about ₹1,700.", grounded: false}          # the model's own rate
  - {text: "That is about ₹20.", grounded: false}             # currency mislabelled
  - {text: "That is roughly ₹950.", grounded: false}          # rounded beyond tolerance
  - {text: "That is about $935.", grounded: false}            # converted figure in the wrong currency
