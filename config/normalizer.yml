# Merchant normalization rules (raw bank descriptor → merchant_norm). Applied in order.
# `extract`: regexes with a named group `m` capturing the merchant from structured
#            descriptors (UPI / NEFT / IMPS / POS / US card prefixes). First match wins.
# `strip_prefixes`: leading tokens removed before cleanup (case-insensitive regex).
# `noise`: patterns deleted anywhere (card digits, refs, dates, store numbers, states).
# `aliases`: final canonical names (regex → name).
extract:
  # UPI/P2M/412345678901/SWIGGY LIMITED/swiggy@axisbank/...   UPI/412345678901/Zomato/zomato@paytm
  - '^UPI[/-](?:P2[AM][/-])?(?:\d{6,}[/-])?(?P<m>[^/@-]{2,}?)\s*[/-]'
  # UPI-SWIGGY-SWIGGY.STORES@AXB-UTIB0000000-412345678901-PAYMENT
  - '^UPI-(?P<m>[A-Z0-9 .&]{2,}?)-'
  # NEFT-HDFC0001234-ACME LTD-SALARY | NEFT/N123456789/ACME LTD | NEFT CR-...-ACME
  - '^NEFT(?:\s?(?:CR|DR))?[/-](?:[A-Z]{4}0[A-Z0-9]{6}[/-])?(?:[A-Z]?\d{6,}[/-])?(?P<m>[^/-]{2,}?)(?:[/-]|$)'
  # BIL/ONL/000123456/BESCOM/BLR  (net-banking bill pay)
  - '^BIL/(?:ONL|BPAY|INB|IMPS)/(?:\d+/)?(?P<m>[^/]{2,}?)(?:/|$)'
  # IMPS/P2A/412345678901/RAHUL SHARMA/...
  - '^IMPS[/-](?:P2[AM][/-])?(?:\d{6,}[/-])?(?P<m>[^/-]{2,}?)(?:[/-]|$)'
  # NACH-LOAN-ICICI / ACH-DR-BAJAJ FINSERV
  - '^(?:NACH|ECS|ACH)[/-](?:DR[/-]|CR[/-])?(?P<m>[^/]{2,}?)(?:[/-]\d|$)'
  # POS 412345XXXXXX1234 STARBUCKS MUMBAI | POS/STARBUCKS/MUMBAI
  - '^POS[/ ](?:[0-9X*]{6,}\s+)?(?P<m>[^/]{2,}?)(?:/|$)'
  # SQ *BLUE BOTTLE COFFEE | TST* SHAKE SHACK 123 | PP*SPOTIFY
  - '^(?:SQ|TST|PP|SP|DD|PAYPAL)\s?\*\s?(?P<m>.+)$'
strip_prefixes:
  - '^(?:CHECKCARD|CHECK CARD|DEBIT CARD PURCHASE|PURCHASE AUTHORIZED ON \d{2}/\d{2}|POS PURCHASE|PURCHASE|RECURRING PAYMENT|ACH (?:DEBIT|CREDIT|WITHDRAWAL|DEPOSIT)|ONLINE PAYMENT|DEBIT|CREDIT)\s+'
  - '^(?:\d{4})\s+'                        # CHECKCARD 0105 ...
  - '^(?:ATM[- ]?WDL|ATM WITHDRAWAL|NWD)\b.*$'   # whole descriptor → handled by alias below
noise:
  - '\b[0-9X*]{4,}\d{4}\b'                  # masked card numbers
  - '\b\d{9,}\b'                            # long reference numbers
  - '\b\d{1,2}[/.-]\d{1,2}(?:[/.-]\d{2,4})?\b'   # dates 01/05, 01-07-2024
  - '\b\d{3}[- ]\d{3}[- ]\d{4}\b'             # phone numbers 866-579-7172
  - '\b8(?:00|33|44|55|66|77|88)-?[A-Z]{4,7}\b'   # vanity numbers 800-COMCAST
  - '\b\d{5,}\b'                                 # store / terminal numbers
  - '#\s?\d+'                               # store numbers (#1234)
  - '\bSTORE\s?\d+\b'
  - '\s\d{1,5}$'                          # trailing store/branch number (SHAKE SHACK 123)
  - '\*(?=[A-Z0-9]*\d)[A-Z0-9]{4,}\b'      # order codes AMZN Mktp US*2K4AB1CD3 (must contain a digit)
  - '@[A-Z0-9.]+'                           # UPI handles
  - '\b(?=(?:[A-Z]*\d){3})(?=(?:\d*[A-Z]){2})[A-Z0-9]{6,}\b'   # booking/order codes (AIRBNB HMXYZ3584): ≥3 digits + ≥2 letters
  - '\b[A-Z]{4}0[A-Z0-9]{6}\b'              # IFSC codes
  - '\b(?:PVT|PRIVATE)?\s*(?:LTD|LIMITED|INC|LLC|CORP)\b\.?'
  - '(?<=\S)\s+(?:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\s*$'   # trailing US state code (only real codes; needs a preceding word)
  - '\b(?:MUMBAI|BANGALORE|BENGALURU|BLR|DELHI|NEW DELHI|CHENNAI|HYDERABAD|PUNE|KOLKATA|GURGAON|GURUGRAM|NOIDA|AHMEDABAD|JAIPUR|LUCKNOW|KOCHI|INDORE|CHANDIGARH|MYSORE|KORAMANGALA|SEATTLE|NEW YORK|SAN FRANCISCO|AUSTIN|CHICAGO|BOSTON|LOS ANGELES|HOUSTON|DALLAS|MINNEAPOLIS|PHOENIX|DENVER|ATLANTA|MIAMI|PORTLAND|SAN DIEGO|SAN JOSE|PHILADELPHIA|WASHINGTON|DETROIT|NASHVILLE|ORLANDO|LAS VEGAS)\b'
  - '(?<=\S)\s+(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)(?:\s?\d{2,4})?\s*$'   # trailing billing month (SAL CR ACME APR) → one merchant per payer
  - '\b(?:MON|TUE|WED|THU|FRI|SAT|SUN)\s+\d{1,2}(?::\d{2})?\s?(?:AM|PM)\b'   # ride/booking time stamps (LYFT RIDE SAT 11PM)
  - '\s+(?:TO|ON|AT|FROM)\s*$'                  # dangling words left after removing dates
  - '\b(?:PAYMENT|PAYMENTS|ONLINE|INDIA|IN|US|USA|COM|WWW)\b'
aliases:
  '^(?:AMZN|AMAZON)\b.*': AMAZON
  '^ATM.*|^NWD.*': ATM WITHDRAWAL
  '^NETFLIX.*': NETFLIX
  '^SPOTIFY.*': SPOTIFY
  '^UBER\s?EATS.*': UBER EATS
  '^UBER.*': UBER
  '^SWIGGY.*': SWIGGY
  '^ZOMATO.*': ZOMATO
  '^STARBUCKS.*': STARBUCKS
  '^BIG\s?BASKET.*': BIGBASKET
  '^OPENAI.*|^CHATGPT.*': OPENAI
  '^GOOGLE\s?\*?\s?(?:YOUTUBE|YT).*': YOUTUBE
