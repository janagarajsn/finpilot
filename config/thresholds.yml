# Deterministic thresholds (analyzer, forecaster, categorizer) and evaluation gates.
categorizer:
  rules_accept_threshold: 0.85    # rule hits below this go to the LLM as hints, not answers
  llm_accept_threshold: 0.60      # LLM answers below this → Uncategorized + needs_review
  llm_batch_size: 25              # unique merchants per LLM call
  fewshot_examples: 12            # user's own labeled transactions shown to the LLM
  memory_write_min_confidence: 0.75   # LLM answers at/above this are remembered per merchant

recurring_detection:
  min_occurrences: 3              # ≥ 3 charges for weekly…quarterly series
  min_occurrences_yearly: 2       # ≥ 2 for yearly series
  regular_share: 0.70             # share of gaps that must fit the period (± tolerance)
  max_amount_cv: 0.35             # amount coefficient of variation above this → not a bill
  yearly_max_amount_cv: 0.10      # yearly series (only 2 charges needed) must be near-fixed
  max_extra_share: 0.34           # other charges at the merchant ≤ 1/3 of the series (else: a habit, not a bill)
  fixed_amount_cv: 0.05           # at or below → "fixed amount" (price-hike detection applies)
  merchant_merge_similarity: 0.88 # fuzzy grouping of merchant names (typos, branch suffixes)
  lapsed_after_periods: 1.6       # no charge for this many periods → status 'lapsed'
  # period label → [nominal days, tolerance days]
  periods:
    weekly: [7, 1]
    biweekly: [14, 2]
    monthly: [30.44, 6]          # ±6: month lengths (28–31) plus up to 3 days of posting delay
    quarterly: [91.3, 10]
    yearly: [365.25, 20]

forecast:
  horizon_days: 90                # default projection length
  n_paths: 2000                   # Monte Carlo paths (seeded per user + as_of)
  lookback_days: 180              # history used for variable-spend rates and residual bootstrap
  half_life_days: 45              # exponential weighting of recent days in variable-spend rates
  dow_prior_weeks: 4              # shrinks day-of-week multipliers toward 1 (pseudo-weeks)
  payday_window_days: 3           # payday effect window (same as patterns)
  payday_multiplier_clip: [0.7, 2.0]
  payday_min_share: 0.25          # income credit ≥ 25% of median monthly income = payday
  sparse_months: 2                # < 2 months of history → low-confidence forecast
  sparse_band_widen: 1.5          # widen p10/p90 distance from p50 when low-confidence
  fx_vol_lookback_days: 180       # stored-rate log-returns used for FX volatility (P1)
  backtest_horizons: [30, 60, 90]

simulator:
  verdict_buffer_from: user_setting_or_currency_default   # user_settings.cash_buffer, else currencies.yml default_cash_buffer
  lever_delay_days: [30, 60]
  lever_category_cut_pct: 20
  lever_installments: 3
  max_clarifications: 2

anomalies:
  robust_z: 3.5                   # |0.6745·(x − median)/MAD| on log amounts / monthly totals
  min_ratio: 3.0                  # outlier must also be ≥ 3× its baseline median (2.0 in the first run: see DESIGN_NOTES)
  merchant_min_history: 4         # merchant baseline needs ≥ 4 other charges …
  category_min_history: 8         # … else the category baseline needs ≥ 8
  duplicate_window_days: 3        # same merchant + same amount within N days
  first_time_large_floor_x: 4     # first-time merchant ≥ 4 × min_anomaly_amount (currencies.yml) …
  first_time_large_percentile: 97 # … and ≥ this percentile of the user's variable expenses
  first_time_warmup_days: 60      # no 'first-time' flags in the first 60 days of a user's history
  price_hike_min_pct: 5           # recurring fixed charge up ≥ 5% vs its previous median
  category_spike_months: 6        # trailing months used as the category baseline
  category_spike_min_months: 3
  lookback_days: 90               # product: findings about the last 90 days (evals scan all history)

patterns:
  weekend_ratio: 1.4              # weekend daily discretionary spend ≥ 1.4× weekday → flag
  payday_window_days: 3           # spend in the N days after an income credit …
  payday_ratio: 1.5               # … ≥ 1.5× an average N-day window → flag
  concentration_share: 0.40       # one category ≥ 40% of discretionary spend → flag
  savings_trend_months: 6
  savings_trend_drop_pts: 10      # savings rate fell ≥ 10 points (first vs last 3 months) → flag
  latte_min_share: 0.05           # small purchases ≥ 5% of spend → flag
  trend_mom_pct: 25               # category up ≥ 25% vs trailing-3-month average → flag
  impulse_categories: [impulse_misc, food_delivery, shopping, entertainment]
  impulse_per_week: 5             # ≥ 5 impulse-category purchases/week AND ≥ 20% of discretionary spend → flag

subscriptions:
  categories: [subscriptions, entertainment]   # plus fixed-price monthly/quarterly/yearly 'discretionary' items
  low_value_cost_multiple: 2.0    # unrated and ≥ 2× the median subscription cost → "likely low value (heuristic)"
  rating_low_max: 1               # usage rating 0–1 (of 5) = "you rated it rarely used"

# Evaluation gates: `make eval-offline` / `make eval` fail if a metric breaks its bound.
# Set from the first real runs (see eval/results/RESULTS.md); never loosened silently.
eval_gates:
  offline:
    categorization.precision_resolved: {min: 0.90}   # when rules/memory answer, they must be right
    categorization.coverage: {min: 0.45}             # share of txns resolved without the LLM
    categorization.injection_safe: {min: 1.0}
    # Phase 4 (first real run: anomalies P 0.56 / R 0.86 / 0.20 FP per clean month; recurring P 0.98 R 1.0)
    anomalies.recall: {min: 0.75}                 # material injected anomalies found
    anomalies.precision: {min: 0.45}
    anomalies.fp_per_month_clean: {max: 0.35}     # false alarms on personas with nothing injected
    # Phase 12: held-out personas (new seeds, never inspected) held to the SAME bounds as above
    anomalies.heldout_recall: {min: 0.75}
    anomalies.heldout_precision: {min: 0.45}
    anomalies.heldout_fp_per_month_clean: {max: 0.35}
    recurring.precision: {min: 0.90}
    recurring.recall: {min: 0.90}
    recurring.period_accuracy: {min: 0.95}
    recurring.next_date_within_3d: {min: 0.90}
    recurring.materializer_correct: {min: 1.0}
    recurring.materializer_idempotent: {min: 1.0}
    # Phase 5 (first real run: daily band coverage 0.77, skill +0.62 / +0.42 vs naive baselines)
    forecast.coverage_daily: {min: 0.65, max: 0.95}   # p10–p90 should hold ~80% of days: too wide is also wrong
    forecast.skill_vs_trailing_mean: {min: 0.30}
    forecast.skill_vs_last_month: {min: 0.20}
    forecast.sparse_ok: {min: 1.0}
    simulation.property_pass_rate: {min: 1.0}
    simulation.historical_scenario_closer: {min: 1.0}
    # Phase 6 (templates offline: 18/18 cited, specific, grounded; guard caught 100% of corruptions)
    advisor.pct_with_finding: {min: 1.0}
    advisor.pct_specific: {min: 1.0}
    advisor.pct_grounded: {min: 1.0}
    advisor.dismissed_not_repeated: {min: 1.0}
    advisor.guard_detection_rate: {min: 0.90}
    advisor.guard_clean_pass_rate: {min: 1.0}
    # Phase 8 (first offline run: cached p95 2 ms, router 0.91 rules-only; LLM intents degraded → uncached)
    cache.invalidation_correct: {min: 1.0}
    cache.cross_user_isolation: {min: 1.0}
    cache.cached_p95_ms: {max: 300}
    cache.router_accuracy: {min: 0.85}
    # Phase 9 (first offline run: lexical retrieval hit@5 0.70; supersede/delete/blocked/isolation 1.0)
    memory.hit_at_5: {min: 0.60}
    # Scope guardrail (set before the first run): the rules never refuse a money question
    memory.scope_rules_false_refusal: {max: 0.0}
    memory.supersede_correct: {min: 1.0}
    memory.deletion_removes_recall: {min: 1.0}
    memory.blocked_rejected: {min: 1.0}
    memory.cross_user_isolation: {min: 1.0}
    # Phase 11 (FX & MCP suite: deterministic, every check must hold)
    fx.conversion_accuracy: {min: 1.0}
    fx.round_trip_within_0_01: {min: 1.0}
    fx.date_resolution: {min: 1.0}
    fx.fallback_chain: {min: 1.0}
    fx.mcp_contract: {min: 1.0}
    fx.allowlist_enforced: {min: 1.0}
    fx.circuit_breaker: {min: 1.0}
    fx.grounding_converted_detection: {min: 1.0}
    fx.grounding_converted_clean_pass: {min: 1.0}
    fx.fx_exposure_correct: {min: 1.0}
    # Guardrails suite (deterministic; dataset written with the implementation: regression gates)
    guardrails.pii_mask_recall: {min: 1.0}
    guardrails.pii_false_mask_rate: {max: 0.0}
    guardrails.pii_mask_p95_ms: {max: 50}
    guardrails.leak_detection_rate: {min: 1.0}
    guardrails.leak_clean_pass_rate: {min: 1.0}
    guardrails.directive_detection_rate: {min: 1.0}
    guardrails.directive_clean_pass_rate: {min: 1.0}
    guardrails.injection_contained: {min: 1.0}
  full:
    categorization.accuracy: {min: 0.80}
    categorization.macro_f1: {min: 0.70}
    categorization.unseen_merchant_accuracy: {min: 0.65}
    categorization.injection_safe: {min: 1.0}
    categorization.custom_category_recall: {min: 0.70}
    anomalies.recall: {min: 0.75}
    anomalies.precision: {min: 0.45}
    anomalies.fp_per_month_clean: {max: 0.35}
    # Phase 12: held-out personas (new seeds, never inspected) held to the SAME bounds as above
    anomalies.heldout_recall: {min: 0.75}
    anomalies.heldout_precision: {min: 0.45}
    anomalies.heldout_fp_per_month_clean: {max: 0.35}
    recurring.precision: {min: 0.90}
    recurring.recall: {min: 0.90}
    recurring.materializer_correct: {min: 1.0}
    recurring.materializer_idempotent: {min: 1.0}
    forecast.coverage_daily: {min: 0.65, max: 0.95}
    forecast.skill_vs_trailing_mean: {min: 0.30}
    simulation.property_pass_rate: {min: 1.0}
    simulation.nl_intent_accuracy: {min: 0.85}   # parser prompt v2 was revised after the first run on this set (DESIGN_NOTES)
    simulation.nl_slot_accuracy: {min: 0.85}
    advisor.pct_with_finding: {min: 1.0}
    advisor.pct_specific: {min: 1.0}
    advisor.pct_grounded: {min: 1.0}             # what users see is always grounded (fallback guarantees it)
    advisor.dismissed_not_repeated: {min: 1.0}
    advisor.guard_detection_rate: {min: 0.90}
    advisor.grounding_first_attempt_pass_rate: {min: 0.50}   # first run: 0.83
    advisor.judge_overall: {min: 0.70}                       # first run: 0.97 (4.8/5)
    # Phase 8 (first full run: hit rate 0.875, cached p95 7 ms, router 0.97)
    cache.hit_rate: {min: 0.60}
    cache.cached_p95_ms: {max: 300}
    cache.invalidation_correct: {min: 1.0}
    cache.cross_user_isolation: {min: 1.0}
    cache.router_accuracy: {min: 0.90}
    cache.degraded_share: {max: 0.05}
    # Phase 9 (first full run: embeddings hit@1 0.90 / hit@5 0.95, writer 1.0, chat grounded 10/10)
    memory.hit_at_5: {min: 0.85}
    # Scope guardrail (set before the first run): ≥ 90% of off-topic requests refused, ≤ 5% of
    # money questions wrongly refused, and the rules alone never refuse one
    memory.scope_rules_false_refusal: {max: 0.0}
    memory.scope_refusal_recall: {min: 0.90}
    memory.scope_false_refusal: {max: 0.05}
    memory.supersede_correct: {min: 1.0}
    memory.deletion_removes_recall: {min: 1.0}
    memory.blocked_rejected: {min: 1.0}
    memory.cross_user_isolation: {min: 1.0}
    memory.writer_recall: {min: 0.75}
    memory.writer_no_leak: {min: 1.0}
    memory.chat_grounded: {min: 0.90}
    # Phase 11 (FX & MCP suite: deterministic, every check must hold)
    fx.conversion_accuracy: {min: 1.0}
    fx.round_trip_within_0_01: {min: 1.0}
    fx.date_resolution: {min: 1.0}
    fx.fallback_chain: {min: 1.0}
    fx.mcp_contract: {min: 1.0}
    fx.allowlist_enforced: {min: 1.0}
    fx.circuit_breaker: {min: 1.0}
    fx.grounding_converted_detection: {min: 1.0}
    fx.grounding_converted_clean_pass: {min: 1.0}
    fx.fx_exposure_correct: {min: 1.0}
    # Guardrails suite (deterministic; dataset written with the implementation: regression gates)
    guardrails.pii_mask_recall: {min: 1.0}
    guardrails.pii_false_mask_rate: {max: 0.0}
    guardrails.pii_mask_p95_ms: {max: 50}
    guardrails.leak_detection_rate: {min: 1.0}
    guardrails.leak_clean_pass_rate: {min: 1.0}
    guardrails.directive_detection_rate: {min: 1.0}
    guardrails.directive_clean_pass_rate: {min: 1.0}
    guardrails.injection_contained: {min: 1.0}
